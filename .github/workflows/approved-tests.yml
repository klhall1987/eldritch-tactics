name: Approved tests

# Fails an implementation PR if it changed the approved tests, or anything else that decides
# whether they pass (see PROTECTED in tools/ticket_guard.sh). This stops the AI from "passing"
# by weakening the tests.
#
# Runs on pull_request_target, so GitHub always uses the definition on main. A PR can't
# edit or delete this check. That's safe because the job never runs code from the PR:
# it only compares files with git, using the guard script from main.
# Make `approved-tests` a required status check on main.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  approved-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # main, not the PR
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check approved tests are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          cp tools/ticket_guard.sh "$RUNNER_TEMP/guard.sh"   # guard from main
          # The repo is private, so authenticate with the workflow's read-only token. It's passed
          # as a header for this one command, not saved in git config.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags \
            "https://github.com/$GITHUB_REPOSITORY.git" "+refs/pull/$PR/head:refs/remotes/pr/head"

          # Tickets this PR implements: its branch name (ticket-<N>-<slug>, or legacy ticket/<N>),
          # plus any issue it closes (Closes #N etc.). A ticket can have several PRs.
          tickets=$( {
            [[ "$HEAD_REF" =~ ^ticket[-/]([0-9]+)(-.*)?$ ]] && echo "${BASH_REMATCH[1]}"
            gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'
          } | sort -un)

          checked=0
          for n in $tickets; do
            labels=$(gh issue view "$n" --json labels --jq '.labels[].name')
            if ! grep -qx feature <<<"$labels"; then
              echo "#$n is not a Feature ticket, skipping."
              continue
            fi
            checked=1
            sha=$(bash "$RUNNER_TEMP/guard.sh" approved-sha "$n")
            if [ -z "$sha" ]; then
              if [ "$IS_DRAFT" = true ]; then
                echo "::notice::#$n: tests not approved yet. Fine while this PR is a draft."
                continue
              fi
              echo "::error::#$n: tests were never approved (no approval marker). Apply tests-approved on the issue first."
              exit 1
            fi
            echo "#$n: approved commits: $(echo $sha)"
            bash "$RUNNER_TEMP/guard.sh" protected "$sha" refs/remotes/pr/head HEAD   # HEAD = main
          done

          if [ "$checked" = 0 ]; then
            echo "Not linked to a Feature ticket, so there are no approved tests to protect."
          fi
