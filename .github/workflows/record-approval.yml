name: Record test approval

# When the owner applies tests-approved, record which commits they approved: the current head
# of every branch for the ticket (ticket-<N>-<slug>, or legacy ticket/<N>). The record is a hidden
# marker in a comment from github-actions[bot]. tools/ticket_guard.sh reads the latest marker.
# /implement and the approved-tests check then make sure every PR for the ticket contains an
# approved commit and hasn't changed the tests since.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  record:
    if: github.event.label.name == 'tests-approved' && github.event.sender.id == github.repository_owner_id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post approval marker
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' \
            "refs/remotes/origin/ticket-$ISSUE-*" "refs/remotes/origin/ticket-$ISSUE" "refs/remotes/origin/ticket/$ISSUE")
          if [ ${#branches[@]} -eq 0 ]; then
            gh issue comment "$ISSUE" --body "⚠️ Nothing to approve: there's no \`ticket-$ISSUE-…\` branch yet. Push the proposed tests first, then apply \`tests-approved\` again."
            exit 1
          fi

          shas=""; list=""
          for b in "${branches[@]}"; do
            sha=$(git rev-parse "refs/remotes/origin/$b")
            case " $shas " in *" $sha "*) ;; *) shas="$shas $sha" ;; esac
            list="$list"$'\n'"- \`$b\` at \`${sha:0:7}\`"
          done
          gh issue comment "$ISSUE" --body "$(printf '<!-- approved-tests:%s -->\nTests approved on:%s\n\nEvery PR for this ticket must build on one of these commits. Next: `/implement %s`.' "$shas" "$list" "$ISSUE")"
