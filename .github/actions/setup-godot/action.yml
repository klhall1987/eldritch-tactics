name: Setup Godot
description: Downloads (and caches) headless-capable Godot for Linux and puts `godot` on PATH.

inputs:
  version:
    description: Godot version, without the -stable suffix.
    default: "4.7.2"

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    - name: Put Godot on PATH
      shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"
